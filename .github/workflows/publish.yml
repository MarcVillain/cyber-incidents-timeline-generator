name: Publish

# Publishes to npm when a GitHub release is published. Authentication uses npm trusted publishing, so no
# token is stored in the repository, and the package is signed with provenance pointing at this workflow.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later, newer than the one bundled with Node 22
      - run: npm install --global npm@latest
      - run: npm ci
      - name: Check the release tag matches the package version
        run: test "v$(node -p "require('./package.json').version")" = "${{ github.event.release.tag_name }}"
      - run: npm publish --provenance --access public
