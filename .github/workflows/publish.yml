name: Publish

# Stages the package on npm when a version tag is pushed, then creates the GitHub release from the
# matching CHANGELOG.md section. A staged version only goes live once a maintainer approves it on npmjs.com
# with two factor authentication, so push access alone cannot ship a release. Authentication uses npm
# trusted publishing, so no token is stored in the repository, and the package carries provenance
# pointing at this workflow.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later, newer than the one bundled with Node 22
      - run: npm install --global npm@latest
      - run: npm ci
      - name: Check the tag matches the package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # Read before publishing, so a version missing from the changelog stops the release early
      - name: Extract the release notes from the changelog
        run: |
          awk -v heading="## [${GITHUB_REF_NAME#v}]" 'index($0, "## [") == 1 { inside = index($0, heading) == 1; next } inside' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      # Checked and built here rather than left to the publish lifecycle scripts, which staging may not run
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm stage publish --provenance --access public
      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
